<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMVA - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <!-- Chart.js v4.4.1 servido localmente (la Raspberry puede no tener internet) -->
    <script src="vendor/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        h1 { font-size: 1.8rem; color: #38bdf8; }
        p.subtitle { font-size: 0.9rem; color: #94a3b8; }
        p.operador-activo { font-size: 1.1rem; color: #94a3b8; margin-top: 6px; }
        p.operador-activo strong { color: #4ade80; }
        
        .profile-selector {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .profile-selector label { font-size: 0.85rem; color: #94a3b8; margin-right: 8px; }
        .profile-selector select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #1e293b;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .val { font-size: 2.2rem; font-weight: bold; color: #38bdf8; margin: 8px 0; }
        .unit { font-size: 0.9rem; color: #64748b; }
        
        /* Estados de Ventilación e IA */
        .on { color: #4ade80; }
        .off { color: #f87171; }
        .warn { color: #fbbf24; }
        .emerg { color: #f87171; }
        
        .ia-card { grid-column: span 2; }
        @media (max-width: 600px) { .ia-card { grid-column: span 1; } }

        .chart-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            height: 350px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SIMVA Dashboard</h1>
            <p class="subtitle">Sistema Inteligente de Monitoreo y Ventilación Automática</p>
            <p class="operador-activo">Operador activo: <strong id="operador-activo">--</strong></p>
        </div>
        
        <!-- Selector de Perfiles (Requerimiento Retroalimentación) -->
        <div class="profile-selector">
            <label for="operador">Operador:</label>
            <select id="operador">
                <option value="ivan">Iván García</option>
                <option value="ingrid">Ingrid Domínguez</option>
                <option value="edgar">Edgar Esquivel</option>
                <option value="leonardo">Leonardo Nájera</option>
            </select>
        </div>
    </header>

    <!-- Tarjetas de Lecturas -->
    <div class="grid">
        <div class="card">
            <h3>Temperatura</h3>
            <div id="temp" class="val">--</div>
            <span class="unit">°C</span>
        </div>
        <div class="card">
            <h3>Humedad</h3>
            <div id="hum" class="val">--</div>
            <span class="unit">%</span>
        </div>
        <div class="card">
            <h3>Nivel CO2</h3>
            <div id="co2" class="val">--</div>
            <span class="unit">ppm</span>
        </div>
        <div class="card">
            <h3>Frecuencia Cardíaca</h3>
            <div id="pulso" class="val">--</div>
            <span class="unit">bpm</span>
        </div>
        <div class="card">
            <h3>Estado</h3>
            <div id="estado" class="val" style="font-size: 1.6rem;">--</div>
            <span id="fuente" class="unit"></span>
        </div>
        <div class="card">
            <h3>Ventilación</h3>
            <div id="vent" class="val off">OFF</div>
            <span id="vent-pct" class="unit">0 %</span>
        </div>
        <div class="card">
            <h3>Vibración</h3>
            <div id="vib" class="val off">0</div>
            <span class="unit">%</span>
        </div>
        <div class="card ia-card">
            <h3>Diagnóstico IA</h3>
            <div id="ia-status" class="val warn" style="font-size: 1.4rem;">Evaluando...</div>
            <span id="ia-detail" class="unit">Pendiente CO2: -- ppm/min</span>
        </div>
    </div>

    <!-- Gráfica de Tendencia en Tiempo Real -->
    <div class="chart-container">
        <canvas id="co2Chart"></canvas>
    </div>

    <script>
        // Inicializar Gráfica Chart.js
        const ctx = document.getElementById('co2Chart').getContext('2d');
        const co2Chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Nivel de CO2 (ppm)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, suggestedMin: 300, suggestedMax: 1500 }
                },
                plugins: { legend: { labels: { color: '#f8fafc' } } }
            }
        });

        function agregarDatoGrafica(hora, co2) {
            if (co2Chart.data.labels.length > 15) {
                co2Chart.data.labels.shift();
                co2Chart.data.datasets[0].data.shift();
            }
            co2Chart.data.labels.push(hora);
            co2Chart.data.datasets[0].data.push(co2);
            co2Chart.update();
        }

        // Función para consumir API de CherryPy o Simular
        async function actualizarDashboard() {
            try {
                // Intenta consumir el servidor de la Raspberry Pi
                const res = await fetch('/estado');
                const data = await res.json();
                
                renderizarDatos(data.temp, data.hum, data.co2, data.pulso, data.vent, data.ia_status, data.pendiente, data.estado, false, data.ventilador_pct, data.vibracion_pct);
            } catch (err) {
                // Modo Simulación en Desarrollo si no hay backend activo
                let t = (20 + Math.random() * 8).toFixed(1);
                let h = (45 + Math.random() * 20).toFixed(1);
                let c = Math.floor(400 + Math.random() * 700);
                let p = Math.floor(65 + Math.random() * 30);
                let slope = (Math.random() * 8 - 2).toFixed(1);
                
                let ventState = c > 800 || slope > 5 ? "ON" : "OFF";
                let iaMsg = slope > 5 ? "Ventilación Anticipada" : "Ambiente Estable";
                
                const estadoSim = c > 2000 ? "Emergencia" : (ventState === "ON" ? "Alerta" : "Normal");
                const ventSim = ventState === "ON" ? Math.min(100, Math.round(40 + Math.max(0, c - 1000) * 0.06)) : 0;
                const vibSim = estadoSim === "Emergencia" ? 100 : (estadoSim === "Alerta" ? 50 : 0);
                renderizarDatos(t, h, c, p, ventState, iaMsg, slope, estadoSim, true, ventSim, vibSim);
            }
        }

        function renderizarDatos(t, h, c, p, v, iaMsg, slope, estado, simulado, ventPct, vibPct) {
            const ahora = new Date().toLocaleTimeString();

            const estadoElem = document.getElementById("estado");
            estadoElem.innerText = estado;
            estadoElem.className = "val " + (estado === "Emergencia" ? "emerg" : estado === "Alerta" ? "warn" : "on");
            const fuenteElem = document.getElementById("fuente");
            fuenteElem.innerText = simulado ? "⚠ Datos simulados (sin servidor)" : "";
            fuenteElem.className = "unit " + (simulado ? "warn" : "");

            document.getElementById("temp").innerText = t;
            document.getElementById("hum").innerText = h;
            document.getElementById("co2").innerText = c;
            // El ESP32 manda pulso 0 cuando el MAX30102 no detecta el dedo
            document.getElementById("pulso").innerText = Number(p) > 0 ? p : "--";
            document.getElementById("vent-pct").innerText = `${ventPct ?? 0} %`;
            const vibElem = document.getElementById("vib");
            vibElem.innerText = vibPct ?? 0;
            vibElem.className = (vibPct ?? 0) > 0 ? "val warn" : "val off";

            // Ventilación
            const ventElem = document.getElementById("vent");
            ventElem.innerText = v;
            ventElem.className = v === "ON" ? "val on" : "val off";
            
            // Diagnóstico IA
            document.getElementById("ia-status").innerText = iaMsg;
            document.getElementById("ia-detail").innerText = `Pendiente CO2: ${slope} ppm/min`;

            agregarDatoGrafica(ahora, c);
        }

        // Informa al servidor el operador activo (se guarda con cada lectura)
        const selectorOperador = document.getElementById('operador');
        function mostrarOperadorActivo() {
            document.getElementById('operador-activo').innerText =
                selectorOperador.options[selectorOperador.selectedIndex].text;
        }
        async function enviarOperador() {
            mostrarOperadorActivo();
            try {
                localStorage.setItem('operador', selectorOperador.value);
            } catch (e) {}
            try {
                await fetch('/operador', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ operador: selectorOperador.value })
                });
            } catch (err) {}
        }
        try {
            const guardado = localStorage.getItem('operador');
            if (guardado) selectorOperador.value = guardado;
        } catch (e) {}
        selectorOperador.addEventListener('change', enviarOperador);
        enviarOperador();

        setInterval(actualizarDashboard, 3000);
        actualizarDashboard();
    </script>
</body>
</html>
