<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>SIMVA - Dashboard</title><style>body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:30px;}.grid{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:30px;}.card{background:#1e293b;padding:20px;border-radius:12px;min-width:180px;border:1px solid #334155;}.val{font-size:2.5em;font-weight:bold;color:#38bdf8;margin:10px 0;}.on{color:#4ade80;}.off{color:#f87171;}</style></head><body><h1>SIMVA Dashboard</h1><p>Sistema Inteligente de Monitoreo y Ventilación Automática</p><div class="grid"><div class="card"><h3>Temperatura</h3><div id="temp" class="val">--</div>°C</div><div class="card"><h3>Humedad</h3><div id="hum" class="val">--</div>%</div><div class="card"><h3>Nivel CO2</h3><div id="co2" class="val">--</div>ppm</div><div class="card"><h3>Ventilación</h3><div id="vent" class="val off">OFF</div></div></div><script>function simular(){let t=(20+Math.random()*8).toFixed(1);let h=(45+Math.random()*20).toFixed(1);let c=Math.floor(400+Math.random()*700);document.getElementById("temp").innerText=t;document.getElementById("hum").innerText=h;document.getElementById("co2").innerText=c;let v=document.getElementById("vent");if(c>800){v.innerText="ON";v.className="val on";}else{v.innerText="OFF";v.className="val off";}}setInterval(simular,2000);simular();</script></body></html>
